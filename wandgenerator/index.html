<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#17263c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>SketchPad Pro – Wandgenerator 4.1.0</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{font:14px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#eef2f6;color:#172b43;display:flex;flex-direction:column}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#f7f8fa}
button,input{font:inherit;color:#172b43}
button{cursor:pointer}
#tools{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid #d6dee7;border-radius:14px;padding:6px;box-shadow:0 4px 18px #17304a1f;z-index:3}
#tools button{width:64px;height:58px;border:0;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#3a5470}
#tools button svg{width:26px;height:26px}
#tools button.on{background:#2454d9;color:#fff}
#tools hr{border:0;border-top:1px solid #e3e8ee;margin:2px 4px}
#top{position:absolute;right:12px;top:12px;display:flex;gap:6px;z-index:3}
#top button{width:46px;height:46px;border:1px solid #d6dee7;border-radius:12px;background:#fff;box-shadow:0 4px 14px #17304a14;font-size:20px;display:flex;align-items:center;justify-content:center}
#top button:disabled{opacity:.35}
input.npf{background:#dbe6ff!important;color:#1d3fae!important}
input[data-np]{-webkit-user-select:none;user-select:none;caret-color:transparent}
#numpad{position:absolute;z-index:8;display:grid;grid-template-columns:repeat(4,46px);gap:5px;background:#172b43;padding:7px;border-radius:12px;box-shadow:0 8px 24px #0005;touch-action:none}
#numpad button{height:40px;border:0;border-radius:8px;background:#fff;color:#172b43;font-size:18px;font-weight:600}
#numpad button.f{background:#2c4462;color:#fff;font-size:15px}
#numpad button.ok{background:#2454d9;color:#fff;grid-column:span 2}
#opPanel{position:absolute;right:12px;top:66px;width:300px;max-height:calc(100% - 80px);overflow:auto;background:#fff;border:1px solid #d6dee7;border-radius:14px;box-shadow:0 8px 28px #17304a2e;padding:12px 12px 10px;z-index:4}
#opPanel h4{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
#opPanel .r{display:grid;grid-template-columns:1fr 84px 22px 30px;align-items:center;gap:5px;margin:5px 0;font-size:13px;color:#3d5571}
#opPanel .r .lb b{display:block;font-size:13.5px;color:#172b43;line-height:1.15}
#opPanel .r .lb small{display:block;font-size:11px;color:#6b7f95;line-height:1.2}
#opPanel .r.seg2{grid-template-columns:1fr 2fr}
#opPanel .st{width:28px;height:28px;border-radius:50%;border:2px solid #c3cfdc;background:#fff;color:#8a9bb0;font-size:13px;font-weight:700;padding:0;line-height:1}
#opPanel .st.s1{border-color:#2454d9;background:#e8efff;color:#2454d9}
#opPanel .st.s2{border-color:#15803d;background:#15803d;color:#fff}
#opPanel .r input.s2{border-color:#15803d;background:#f0fbf3}
#opPanel .leg{font-size:11.5px;color:#5a6f86;margin:-2px 0 6px}
#opPanel .leg i{font-style:normal;font-weight:700}
#opPanel .r input{width:100%;padding:7px 8px;border:1px solid #c3cfdc;border-radius:8px;text-align:right;font-weight:600}
#opPanel .r input:focus{outline:2px solid #2454d9;border-color:#2454d9}
#opPanel .r.cur .lb b{color:#2454d9}
#opPanel .seg{display:flex;gap:4px}
#opPanel .seg button,#opPanel .btns button{flex:1;padding:7px 6px;border:1px solid #c3cfdc;border-radius:8px;background:#fff;font-size:12.5px}
#opPanel .seg button.on{background:#2454d9;border-color:#2454d9;color:#fff}
#opPanel .info{font-size:12px;color:#5a6f86;background:#f3f6f9;border-radius:8px;padding:6px 8px;margin:6px 0}
#opPanel .btns{display:flex;gap:6px;margin-top:8px}
#opPanel .btns .warn{color:#c8161d;border-color:#e7a1a4}
@media (max-width:700px){#opPanel{top:auto;bottom:0;right:0;left:0;width:auto;max-height:55%;border-radius:14px 14px 0 0}}
#settings{position:absolute;right:12px;top:66px;width:270px;background:#fff;border:1px solid #d6dee7;border-radius:14px;box-shadow:0 8px 28px #17304a2e;padding:12px;z-index:4}
#settings h4{margin:4px 0 8px;font-size:13px;color:#5a6f86;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
#settings .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
#settings input[type=number]{width:96px;padding:7px 8px;border:1px solid #c3cfdc;border-radius:8px}
#settings input[type=checkbox]{width:20px;height:20px}
#settings .btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
#settings .btns button{padding:9px 6px;border:1px solid #c3cfdc;border-radius:9px;background:#fff}
#settings .btns .warn{color:#c8161d;border-color:#e7a1a4}
#ctx{position:absolute;display:flex;align-items:center;gap:4px;background:#172b43;color:#fff;border-radius:12px;padding:5px;box-shadow:0 6px 20px #0003;z-index:3;transform:translate(-50%,-100%);white-space:nowrap}
#ctx button{border:0;background:transparent;color:#fff;padding:8px 10px;border-radius:8px;font-size:13.5px}
#ctx button:hover{background:#ffffff1f}
#ctx .sep{width:1px;align-self:stretch;background:#ffffff33;margin:3px 2px}
#ctx .del{color:#ffb4b4}
.inl{position:absolute;z-index:5;transform:translate(-50%,-50%);width:110px;padding:7px 8px;border:2px solid #2454d9;border-radius:9px;text-align:center;font-weight:600;font-size:15px;background:#fff;box-shadow:0 6px 18px #0003}
#chainBar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;z-index:3}
#chainBar button{padding:11px 20px;border-radius:24px;border:0;background:#172b43;color:#fff;font-weight:600;box-shadow:0 6px 18px #0003}
#chainBar button.sec{background:#fff;color:#172b43;border:1px solid #c3cfdc}
#chainBar button:disabled{opacity:.4}
.dirs{position:absolute;z-index:5;transform:translate(-50%,0);display:flex;gap:4px;background:#fff;padding:4px;border-radius:10px;box-shadow:0 6px 18px #0003}
.dirs button{width:38px;height:34px;border:1px solid #c3cfdc;border-radius:8px;background:#fff;font-size:17px}
.dirs button.on{background:#2454d9;color:#fff;border-color:#2454d9}
#palette{position:absolute;z-index:6;display:flex;gap:6px;background:#172b43;padding:7px;border-radius:12px;box-shadow:0 6px 20px #0004;transform:translate(-50%,-100%)}
#palette button{width:28px;height:28px;border-radius:7px;border:2px solid #fff6;padding:0}
#palette .std{width:auto;padding:0 8px;color:#fff;background:transparent;font-size:12.5px}
#hint{position:absolute;left:92px;bottom:14px;max-width:min(520px,calc(100% - 110px));pointer-events:none;color:#4a6079;font-size:12.5px;background:#ffffffd9;padding:6px 10px;border-radius:8px}
#chainBar:not([hidden])~#hint{display:none}
@media (max-width:700px){#hint{display:none}#tools button{width:56px;height:52px}}
</style>
</head>
<body>
<div id="stage">
 <canvas id="cv"></canvas>
 <div id="tools">
  <button id="tSelect" title="Auswählen, verschieben, Maße ändern"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 3l14 8-6 1.6L10 19z"/></svg>Auswahl</button>
  <hr>
  <button id="tRoom" title="Raum aufziehen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="14" rx="1"/><rect x="6" y="7.5" width="12" height="9" stroke-dasharray="2 2"/></svg>Raum</button>
  <button id="tOuter" title="Außenwand zeichnen"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="6" rx="1" fill="currentColor" opacity=".9"/></svg><span id="lOuter">Außen 300</span></button>
  <button id="tInner" title="Innenwand zeichnen"><svg viewBox="0 0 24 24"><rect x="3" y="10.5" width="18" height="3" rx="1" fill="currentColor" opacity=".9"/></svg><span id="lInner">Innen 150</span></button>
  <hr>
  <button id="tDoor" title="Tür einsetzen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4M16 20h4"/><path d="M8 20V8"/><path d="M8 8a12 12 0 0 1 12 12" stroke-dasharray="2 2"/></svg>Tür</button>
  <button id="tWin" title="Fenster einsetzen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="9" width="18" height="6"/><path d="M3 12h18"/><rect x="2" y="15" width="20" height="3" fill="currentColor" opacity=".35" stroke="none"/></svg>Fenster</button>
  <button id="tRad" title="Heizkörper einsetzen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="10" rx="1.5"/><path d="M7 7v10M11 7v10M15 7v10M19 7v10" stroke-width="1.2"/><circle cx="5" cy="19.5" r="1.4" fill="currentColor" stroke="none"/></svg>Heizkörper</button>
  <button id="tBlk" title="Rechteck: Kamin, Vorsatz, Raumteiler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="14" rx="1" fill="currentColor" fill-opacity=".18"/><path d="M4 12l7-7M4 19l14-14M11 19l9-9" stroke-width="1"/></svg>Rechteck</button>
 </div>
 <div id="top">
  <button id="bUndo" title="Rückgängig">↶</button>
  <button id="bRedo" title="Wiederholen">↷</button>
  <button id="bZoom" title="Zoom – antippen = 100 %" style="width:auto;padding:0 12px;font-size:14px;font-weight:600">100 %</button>
  <button id="bFit" title="Alles zeigen">⤢</button>
  <button id="bSet" title="Einstellungen">⚙</button>
 </div>
 <div id="settings" hidden>
  <h4>Wandvorgaben</h4>
  <div class="row"><span>Außenwand (mm)</span><input id="sOuter" type="number" min="20" step="5" inputmode="numeric"></div>
  <div class="row"><span>Innenwand (mm)</span><input id="sInner" type="number" min="20" step="5" inputmode="numeric"></div>
  <div class="row"><span>Raumhöhe (mm)</span><input id="sRoomH" type="number" min="500" step="10" inputmode="numeric"></div>
  <h4 style="margin-top:14px">Anzeige</h4>
  <div class="row"><label for="sOuterDims">Außenmaße anzeigen</label><input id="sOuterDims" type="checkbox"></div>
  <div class="row"><label for="sSnap">Fang (10 mm, Fluchtlinien)</label><input id="sSnap" type="checkbox"></div>
  <div class="row"><label for="sAng">Winkelraster</label><select id="sAng" style="padding:7px;border:1px solid #c3cfdc;border-radius:8px"><option value="90">90°</option><option value="45">45°</option><option value="15">15°</option><option value="5">5°</option><option value="0">frei</option></select></div>
  <div class="row"><label for="sCenter">Wandmitte als Fangpunkt</label><input id="sCenter" type="checkbox"></div>
  <div class="row"><label for="sLen">Maß ändern</label><select id="sLen" style="padding:7px;border:1px solid #c3cfdc;border-radius:8px;max-width:150px"><option value="local">nur Nachbarwand passt sich an</option><option value="shift">alles dahinter verschieben</option></select></div>
  <div class="btns">
   <button id="bRwm" style="grid-column:span 2;background:#172b43;color:#fff;border-color:#172b43">Export 3DW-Plus (.rwm)</button>
   <button id="bExample">Beispielraum</button>
   <button id="bExport">Daten kopieren</button>
   <button id="bImport">Daten laden</button>
   <button id="bClear" class="warn">Alles löschen</button>
  </div>
  <input id="file" type="file" accept=".json,application/json" hidden>
 </div>
 <div id="ctx" hidden></div>
 <div id="opPanel" hidden></div>
 <div id="chainBar" hidden><button id="bChainUndo" class="sec">Letzte zurück</button><button id="bOff" class="sec">📐 Abstand</button><button id="bLen" class="sec">📏 Maß</button><button id="bDone">Fertig</button></div>
 <div id="hint"></div>
 <div id="numpad" hidden></div>
</div>

<script>
(()=>{'use strict';
/* =====================================================================
   SketchPad Pro – Wandgenerator 2.0 · eigenständig entwickelter Code
   Einheiten: Millimeter. Knoten {id,x,y}, Wände {id,a,b,t,align,kind}.
   kind: 'outer' (Außenwand) | 'inner' (Innenwand)
   ===================================================================== */
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage');
const C={wall:'#cfd5dc',wallOuter:'#b9c1ca',edge:'#24384f',sel:'#2454d9',room:'#fbf7ee',dim:'#23425f',dimOut:'#7b8da0',newDim:'#c2410c',guide:'#e08a00',snap:'#ffd84a'};
const STORE='sketchpad-pro-wandgenerator-v2',SETS='sketchpad-pro-wandgenerator-settings';
const SNAP_PX=18;
// Wandstärken farblich klar unterscheidbar (feste Zuordnung, damit gleiche Stärke immer gleich aussieht)
// Grautöne nach Wandstärke: dickste = hellgrau, jede dünnere Stärke eine Stufe heller
const GREYS=['#bfc6ce','#d5dbe1','#e5e9ed','#eff1f4'];
let rankMap=new Map();
function buildRanks(st){const ts=[...new Set(st.walls.map(w=>w.t))].sort((a,b)=>b-a);rankMap=new Map(ts.map((t,i)=>[t,GREYS[Math.min(i,GREYS.length-1)]]))}
const wallColor=t=>rankMap.get(t)||GREYS[1];
const colorOf=w=>w.color||wallColor(w.t);
const SWATCHES=['#bfc6ce','#d5dbe1','#e5e9ed','#d8c6a5','#bcd3e8','#c6dcbc','#e8c9c9','#ddd2ec','#efe0ad'];

/* ---------- Vektoren ---------- */
const V=(x,y)=>({x,y});
const add=(a,b)=>V(a.x+b.x,a.y+b.y),sub=(a,b)=>V(a.x-b.x,a.y-b.y),mul=(a,k)=>V(a.x*k,a.y*k);
const dot=(a,b)=>a.x*b.x+a.y*b.y,cross=(a,b)=>a.x*b.y-a.y*b.x;
const len=a=>Math.hypot(a.x,a.y),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const unit=a=>{const l=len(a)||1;return V(a.x/l,a.y/l)};
const leftN=d=>V(d.y,-d.x),rightN=d=>V(-d.y,d.x); // Bildschirm: y nach unten
function lineHit(p,d,q,e){const den=cross(d,e);if(Math.abs(den)<1e-9)return null;return add(p,mul(d,cross(sub(q,p),e)/den))}
function segParam(p,a,b){const ab=sub(b,a),l2=dot(ab,ab)||1;return dot(sub(p,a),ab)/l2}
function pointInPoly(p,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a.y>p.y)!==(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)ins=!ins}return ins}
function signedArea(p){let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=a.x*b.y-b.x*a.y}return s/2}
const fmt=n=>Math.round(n).toLocaleString('de-DE');
const fmtArea=a=>(a/1e6).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' m²';

/* ---------- Einstellungen ---------- */
let set={roomH:2600,outerT:300,innerT:150,showOuter:false,snap:true,angStep:15,centerSnap:false,lenMode:'local',door:{vam:1030,ue:72,vs:15,vok:2080,griff:70},win:{w:1250,rev:120,sf:30,ssL:30,ssR:30,fbUK:900,fbD:30,fOK:2150},rad:{w:1000,h:600,uk:150,d:100,abW:50,con:'R',thW:80}};
const DEF_DOOR={...set.door},DEF_WIN={...set.win},DEF_RAD={...set.rad};
try{Object.assign(set,JSON.parse(localStorage.getItem(SETS)||'{}'))}catch(e){}
set.door={...DEF_DOOR,...set.door};set.win={...DEF_WIN,...set.win};set.rad={...DEF_RAD,...set.rad};delete set.door.w;
const saveSet=()=>{try{localStorage.setItem(SETS,JSON.stringify(set))}catch(e){}};
const wallProps=kind=>kind==='outer'?{t:set.outerT,align:'left',kind:'outer'}:{t:set.innerT,align:'center',kind:'inner'};

/* ---------- Modell ---------- */
let S={nodes:[],walls:[],seq:1,openings:[],blocks:[]};
let nodeMap=new Map();
function reindex(){nodeMap=new Map(S.nodes.map(n=>[n.id,n]))}
const N=id=>nodeMap.get(id),W=id=>S.walls.find(w=>w.id===id);
const nOf=(st,id)=>st.nodes.find(n=>n.id===id);
// ref = Abstand der bündigen Wandseite von der Knotenlinie (+ links, − rechts der Richtung a→b)
function sides(w){const t=w.t;if(w.ref){const p=w.ref;return p>0?[p,t-p]:[t+p,-p]}return w.align==='center'?[t/2,t/2]:w.align==='right'?[0,t]:[t,0]}

function hull(pts){const p=pts.filter(Boolean).map(q=>({x:q.x,y:q.y})).sort((a,b)=>a.x-b.x||a.y-b.y);if(p.length<3)return p;const cr=(o,a,b)=>(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);const lo=[],up=[];for(const q of p){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q)}for(const q of p.slice().reverse()){while(up.length>=2&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q)}return lo.slice(0,-1).concat(up.slice(0,-1))}
/* ---------- Geometrie: Ecken an jedem Knoten ---------- */
function geometry(st){
 const nm=new Map(st.nodes.map(n=>[n.id,n]));
 const inc=new Map();
 for(const w of st.walls)for(const id of [w.a,w.b]){if(!inc.has(id))inc.set(id,[]);inc.get(id).push(w)}
 const G=new Map(),hubs=[],steps=[],caps=[],nodeEnds=new Map(),straight=[];
 for(const w of st.walls)G.set(w.id,{});
 for(const [nid,list] of inc){
  const o=nm.get(nid);if(!o)continue;
  const ends=[];
  for(const w of list){
   const atA=w.a===nid,oid=atA?w.b:w.a,other=nm.get(oid);if(!other||dist(other,o)<1e-6)continue;
   const d=unit(sub(other,o)),[L,R]=sides(w);
   const e={w,atA,other:oid,d,ang:Math.atan2(d.y,d.x),L:atA?L:R,R:atA?R:L};
   e.pl=add(o,mul(leftN(d),e.L));e.pr=add(o,mul(rightN(d),e.R));ends.push(e);
  }
  ends.sort((p,q)=>p.ang-q.ang);nodeEnds.set(nid,ends);
  const n=ends.length;if(!n)continue;
  if(n===1){const e=ends[0];e.cl=e.pl;e.cr=e.pr;caps.push([e.pl,e.pr])}
  else for(let i=0;i<n;i++){
   // Rechte Fläche dieser Wand trifft linke Fläche der im Uhrzeigersinn folgenden Wand
   const c=ends[i],x=ends[(i+1)%n];
   const hit=lineHit(c.pr,c.d,x.pl,x.d),limit=5*Math.max(c.L+c.R,x.L+x.R,10);
   if(hit&&dist(hit,o)<=limit){c.cr=hit;x.cl=hit}
   else{c.cr=c.pr;x.cl=x.pl;if(dist(c.pr,x.pl)>.5)steps.push([c.pr,x.pl]);else if(Math.abs(cross(c.d,x.d))<1e-3)straight.push(c.pr)}
  }
  if(n>=2){const hub=[];for(const e of ends)hub.push(e.cl,e.cr);hubs.push({pts:hull(hub),w:ends.reduce((m,e)=>e.w.t>m.t?e.w:m,ends[0].w)})}
  for(const e of ends){const g=G.get(e.w.id);if(e.atA){g.aL=e.cl;g.aR=e.cr}else{g.bR=e.cl;g.bL=e.cr}}
 }
 for(const w of st.walls){
  const g=G.get(w.id),A=nm.get(w.a),B=nm.get(w.b);if(!A||!B)continue;
  const d=unit(sub(B,A)),[L,R]=sides(w);
  g.aL=g.aL||add(A,mul(leftN(d),L));g.aR=g.aR||add(A,mul(rightN(d),R));
  g.bL=g.bL||add(B,mul(leftN(d),L));g.bR=g.bR||add(B,mul(rightN(d),R));
  g.poly=[g.aL,g.bL,g.bR,g.aR];g.d=d;g.axis=dist(A,B);g.faceL=dist(g.aL,g.bL);g.faceR=dist(g.aR,g.bR);
 }
 // Eckpunkte der Wandkanten je Knoten (Fangpunkte für bündiges Ansetzen)
 const corners=[];
 for(const [nid,ends] of nodeEnds){const o=nm.get(nid),seen=[];for(const e of ends)for(const c of [e.cl,e.cr]){if(!c||seen.some(q=>dist(q,c)<1)||straight.some(q=>dist(q,c)<1))continue; // durchlaufende Wandseite: keine Ecke
seen.push(c);corners.push({nid,p:c,atNode:dist(c,o)<1})}}

/* ---------- Raumerkennung: Flächen des Wandnetzes umlaufen ---------- */
function findRooms(st,geo){

// Beschriftungspunkt: möglichst weit weg von Raumkanten und Wänden (auch frei stehenden)

/* ---------- Längen ändern: Endpunkt verschieben, Anschlusswände mitführen ---------- */

// Wände, die über die Schnittlinie reichen, werden dabei gestreckt bzw. gestaucht.
// Liegt am wandernden Ende ein T-Anschluss mit durchgehender Wand, gleitet nur die abzweigende Wand mit

  const id=stack.pop();if(moved.has(id))continue;if(id===fixedId||onLine(N(id)))return false;

  const par=ws.filter(o=>{const x=N(o.a===id?o.b:o.a);return Math.abs(cross(unit(sub(x,n)),dir))<.02});

// Gerader Wandzug durch einen Knoten (über gerade Durchgangspunkte hinweg), ohne die Wand "ex"

function load(d){
 if(!Array.isArray(d.nodes)||!Array.isArray(d.walls))return;
 pushUndo();
 S={nodes:d.nodes,walls:d.walls.map(w=>({...w,kind:w.kind==='outer'||w.kind==='Außenwand'?'outer':'inner',align:w.align||'center'})),seq:d.seq||1+Math.max(0,...d.nodes.map(n=>n.id),...d.walls.map(w=>w.id)),openings:Array.isArray(d.openings)?d.openings:[],blocks:Array.isArray(d.blocks)?d.blocks:[]};
 sel=null;chain=null;buildCtx();changed();fit();
}
document.addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT')return;
 if(e.key==='Escape'&&off){off=null;ui();render();return}
 if(e.key==='Escape'){if(chain)endChain();else{sel=null;buildCtx();render()}}
 else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}
 else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}
 else if((e.key==='Delete'||e.key==='Backspace')&&sel&&tool==='select'){($('cDel')||$('cDelN')||$('oDel')||$('bDel'))?.click()}
 else if(chain&&!chain.count&&e.key.toLowerCase()==='a'){e.preventDefault();openOffsetInput()}
 else if(chain&&/^[0-9]$/.test(e.key)){ // Zahl tippen während des Zeichnens = genaue Länge
  e.preventDefault();rememberDir();openLengthInput(e.key);
 }
});
